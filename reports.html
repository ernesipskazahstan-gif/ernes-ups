<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERNES — Журнал актов (Диагностика / ТО)</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root{
    --navy:#1F4E79;
    --amber:#F2B705;
    --cream:#FFF4D6;
    --gray-bg:#F2F2F2;
    --green:#2E9E4C;
    --yellow:#E0A800;
    --red:#D9362B;
    --text:#222;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--gray-bg); color:var(--text);
  }
  header{
    background:var(--navy); color:#fff; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{margin:0; font-size:18px;}
  header .sub{font-size:12px; opacity:.8;}

  .wrap{max-width:960px; margin:0 auto; padding:18px;}

  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .toolbar input{
    flex:1; min-width:200px; padding:10px 12px; border:1px solid #ccc; border-radius:8px; font-size:14px;
  }
  .toolbar button{
    padding:10px 16px; border-radius:8px; border:none; background:var(--navy); color:#fff; cursor:pointer; font-size:14px;
  }

  .act-card{
    background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.08); cursor:pointer; transition:box-shadow .15s;
  }
  .act-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.14);}
  .act-card .top-row{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .act-card .act-num{font-weight:700; color:var(--navy); font-size:15px;}
  .act-card .date{font-size:12px; color:#888;}
  .act-card .client{font-size:14px; margin-top:4px; font-weight:600;}
  .act-card .meta{font-size:12px; color:#666; margin-top:2px;}
  .status-dots{display:flex; gap:5px; margin-top:8px;}
  .dot{width:12px; height:12px; border-radius:50%; border:1px solid rgba(0,0,0,.1); flex-shrink:0;}
  .dot.green{background:var(--green);}
  .dot.yellow{background:var(--yellow);}
  .dot.red{background:var(--red);}
  .dot.gray{background:#ddd;}

  .empty-msg, .loading-msg{text-align:center; color:#888; padding:40px 0;}

  #detailView{display:none;}
  .back-btn{
    background:none; border:none; color:var(--navy); font-size:14px; cursor:pointer;
    padding:8px 0; margin-bottom:10px; display:flex; align-items:center; gap:6px;
  }
  .detail-card{background:#fff; border-radius:12px; padding:20px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .detail-header-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .detail-card h2{
    color:var(--navy); font-size:20px; margin:0 0 4px; border-bottom:3px solid var(--amber); padding-bottom:8px; flex:1;
  }
  .detail-card .detail-sub{font-size:13px; color:#777; margin-bottom:14px;}
  .kv-table{width:100%; border-collapse:collapse; font-size:14px;}
  .kv-table td{padding:6px 4px; border-bottom:1px solid #f0f0f0; vertical-align:top;}
  .kv-table td.k{color:#666; width:42%; font-weight:600;}

  .section-title{color:var(--navy); font-size:14px; font-weight:700; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.03em;}

  .unit-block{border:1px solid #ddd; border-radius:10px; margin-bottom:12px; overflow:hidden;}
  .unit-block-header{
    background:var(--cream); padding:10px 14px; cursor:pointer; font-weight:700; color:var(--navy);
    display:flex; align-items:center; gap:8px; font-size:14px;
  }
  .unit-block-header .arrow{width:12px; flex-shrink:0;}
  .unit-block-header .badges{display:flex; gap:3px; margin-left:auto;}
  .unit-block-body{padding:14px;}
  .unit-block-body.collapsed{display:none;}

  .status-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f5f5f5; font-size:14px;}
  .status-row .dot{width:14px; height:14px;}
  .status-row .item-name{font-weight:600; min-width:160px;}
  .status-row .item-comment{color:#555; font-size:13px;}

  .conclusion-box{background:var(--cream); border-radius:8px; padding:14px; font-size:14px; white-space:pre-wrap; line-height:1.5;}

  .photo-group-title{font-size:13px; font-weight:700; color:var(--navy); margin:14px 0 6px;}
  .photo-subgroup-title{font-size:12px; font-weight:600; color:#666; margin:10px 0 4px;}
  .photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px;}
  .photo-grid img{width:100%; height:110px; object-fit:cover; border-radius:8px; border:1px solid #ddd; cursor:pointer;}
  .no-photos{color:#999; font-size:13px; font-style:italic;}

  .drive-link{display:inline-block; margin-top:10px; font-size:13px; color:var(--navy);}

  .edit-btn, .save-btn, .cancel-btn{
    padding:8px 14px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer;
  }
  .edit-btn{background:var(--navy); color:#fff;}
  .save-btn{background:var(--amber); color:#1a1a1a;}
  .cancel-btn{background:#eee; color:#333; margin-left:8px;}

  .sub-card{border:1px solid #e3e3e3; border-radius:10px; padding:12px; margin-bottom:10px; position:relative;}
  .sub-card .sub-title{font-weight:700; font-size:13px; color:var(--navy); margin-bottom:8px;}
  .remove-btn{position:absolute; top:10px; right:10px; background:none; border:none; color:#c33; font-size:12px; cursor:pointer;}
  .add-btn{width:100%; padding:10px; border-radius:8px; border:2px dashed var(--navy); background:var(--cream); color:var(--navy); font-weight:600; font-size:13px; cursor:pointer;}

  .edit-field{margin-bottom:8px;}
  .edit-field label{display:block; font-size:12px; color:#666; margin-bottom:3px; font-weight:600;}
  .edit-field input, .edit-field select, .edit-field textarea{
    width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:6px; font-size:14px; font-family:inherit;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .mic-row{display:flex; gap:6px; align-items:flex-start;}
  .mic-row textarea{flex:1;}
  .mic-btn{flex-shrink:0; width:36px; height:36px; border-radius:50%; border:none; background:var(--navy); color:#fff; cursor:pointer;}
  .mic-btn.rec{background:var(--red);}

  .edit-status-item{border:1px solid #eee; border-radius:8px; padding:10px; margin-bottom:8px;}
  .edit-status-item .item-title{font-weight:600; font-size:13px; margin-bottom:6px; color:var(--navy);}

  .photo-edit-item{position:relative;}
  .photo-edit-item img{width:100%; height:110px; object-fit:cover; border-radius:8px; border:1px solid #ddd; cursor:pointer; display:block;}
  .photo-del-btn{
    position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; border:none;
    background:var(--red); color:#fff; font-size:13px; cursor:pointer; line-height:1;
  }

  #lightbox{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  #lightbox img{max-width:100%; max-height:100%; border-radius:6px;}
  /* ===== Печатный шаблон (скрыт на экране, виден только при печати) ===== */
  .print-only{display:none;}
  .print-page{width:210mm; margin:0 auto; background:#fff; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:#222; position:relative;}
  @page{size:A4; margin:0;}
  .ptable{width:210mm; border-collapse:collapse; table-layout:fixed;}
  .ptable > thead > tr > td{padding:0; height:10mm;}
  .ptable > tbody > tr > td{padding:0 0 4mm 0; vertical-align:top;}
  .ptable > tfoot > tr > td{padding:0; height:26mm;}
  .pfoot-spacer{height:26mm;}
  .pdoc-header{padding:20px 30px 4px; background:#fff; border-bottom:3px solid; border-image:linear-gradient(90deg,#3CB043,#F2B705) 1;}
  .pheader-top{display:flex; justify-content:space-between; align-items:center;}
  .plogo-row img{height:118px; width:auto; display:block;}
  .pdocno{text-align:right;}
  .pdocno .num{font-weight:800; font-size:14px; color:#1F4E79; white-space:nowrap;}
  .pdocno .date{display:inline-block; margin-top:7px; color:#3CB043; font-weight:600; font-size:12.5px; border-bottom:2px solid #3CB043; padding:3px 0 5px;}
  .phero{display:grid; grid-template-columns:1fr 200px; gap:14px; align-items:center; margin-top:10px;}
  .ptitle{font-size:25px; line-height:1.08; font-weight:900; color:#1F4E79; margin:0; text-transform:uppercase;}
  .ptitle span{display:block; color:#3CB043;}
  .paccent{width:26px; height:2px; background:#3CB043; margin:8px 0;}
  .pintro{font-size:11px; line-height:1.42; color:#333; max-width:330px; margin:2px 0 10px;}
  .phero-img{width:100%; max-width:190px; height:auto; display:block; margin:0 auto;}
  .pcontent{padding:16px 26px 0;}
  .pcontent-nohead{padding-top:26px;}
  .psection{margin-bottom:16px;}
  .poverview{display:grid; grid-template-columns:150px 1fr; gap:20px; align-items:center; padding:6px 0;}
  .pov-donut{text-align:center;}
  .pov-donut .pov-label{font-size:11px; font-weight:700; margin-top:4px;}
  .pov-dirs{display:grid; grid-template-columns:1fr 1fr; gap:2px 22px;}
  .pov-dir{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px; padding:4px 0; border-bottom:1px solid #f0f0f0;}
  .pov-dir-name{color:#333; font-weight:600;}
  .pov-dot{width:12px; height:12px; border-radius:50%; flex-shrink:0; border:1px solid rgba(0,0,0,.08);}
  .pov-improve{font-size:13px; margin:2px 0 12px; padding:8px 12px; background:#eef6ee; border-radius:8px;}
  .pov-improve .pov-up{color:#2E9E4C; font-weight:800; margin-left:6px;}
  .edit-unit{border:1px solid #e0e0e0; border-radius:10px; padding:12px; margin-bottom:14px; background:#fafafa;}
  .eu-title{font-weight:800; color:#1F4E79; margin-bottom:8px;}
  .eto-hint{font-size:12px; color:#8a6d00; background:#fff8e1; border-radius:6px; padding:6px 8px; margin:6px 0;}
  .eto-sec{font-weight:700; color:#1F4E79; font-size:13px; margin:12px 0 4px; padding-top:6px; border-top:1px dashed #ddd;}
  .eto-item{margin-bottom:8px;}
  .eto-lbl{font-size:13px; color:#333; font-weight:600; margin-bottom:3px;}
  .eto-row{display:flex; align-items:center; gap:8px; margin:3px 0; font-size:13px;}
  .eto-row > span{flex:0 0 78px; color:#666;}
  .eto-row input, .eto-row select{flex:1; padding:7px; border:1px solid #ccc; border-radius:6px; font-size:14px;}
  .eto-svc{font-size:11px; color:#888; margin-top:2px;}
  .eto-check{display:flex; align-items:center; gap:8px; font-size:13px;}
  .eto-phase{display:flex; gap:8px;} .eto-phase label{flex:1; font-size:12px; color:#666;} .eto-phase input{width:100%; padding:6px; border:1px solid #ccc; border-radius:6px;}
  .eto-cell-row{display:flex; align-items:center; gap:6px; margin:3px 0;} .eto-cell-row span{flex:0 0 34px; font-size:12px; color:#888;}
  .eto-cell-row input{flex:1; padding:6px; border:1px solid #ccc; border-radius:6px;}
  .eto-x{background:#f3d6d3; border:none; border-radius:6px; padding:6px 9px; cursor:pointer;}
  .eto-add{background:#e8f0e8; border:none; border-radius:6px; padding:7px 12px; font-size:13px; cursor:pointer; margin-top:4px;}
  .edit-actions{display:flex; gap:10px; margin-top:14px;}
  .cancel-btn{background:#eee; color:#333; border:none; border-radius:8px; padding:12px 16px; font-weight:700; cursor:pointer;}
  .pov-cols{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:12px;}
  .pov-block-head{font-size:10px; font-weight:800; color:#1F4E79; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .pov-li{display:flex; gap:6px; align-items:flex-start; font-size:11px; padding:3px 0; line-height:1.35;}
  .pov-li .ic{flex-shrink:0; font-weight:800; width:14px; text-align:center;}
  .pov-li.ok .ic{color:#2E9E4C;} .pov-li.warn .ic{color:#E0A800;} .pov-li.bad .ic{color:#D9362B;}
  .pov-more{font-size:10px; color:#888; margin-top:2px; font-style:italic;}
  .pov-stats{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid #eee;}
  .pov-stat{text-align:center; background:#f7f9fb; border-radius:8px; padding:8px 4px;}
  .pov-stat .v{font-size:18px; font-weight:800; color:#1F4E79;}
  .pov-stat .l{font-size:10.5px; color:#555; margin-top:3px; font-weight:600;}
  .psection-head{display:flex; align-items:center; gap:8px; font-size:11px; font-weight:800; color:#1F4E79; text-transform:uppercase; letter-spacing:.05em; border-bottom:2px solid #FFF4D6; padding-bottom:5px; margin-bottom:8px;}
  .pinfo-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 20px; font-size:12px;}
  .pinfo-item{padding:4px 0; border-bottom:1px solid #f0f0f0;}
  .pinfo-item .lbl{color:#888; font-size:9px; text-transform:uppercase;}
  .pinfo-item .val{font-weight:600;}
  .punit{border:1px solid #e6e6e6; border-radius:6px; margin-bottom:10px; overflow:hidden; page-break-inside:avoid;}
  .punit-title{background:#1F4E79; color:#fff; font-size:11px; font-weight:700; padding:5px 10px;}
  .punit-body{display:grid; grid-template-columns:1.1fr 1fr;}
  .punit-info{padding:8px 10px; font-size:11px; border-right:1px solid #eee;}
  .punit-info .row{display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px dotted #eee;}
  .punit-info .row .k{color:#888;}
  .punit-info .row .v{font-weight:600; text-align:right;}
  .punit-status{padding:8px 10px;}
  .pstatus-line{display:flex; gap:6px; padding:3px 0; font-size:11px;}
  .pstatus-line .dot{width:8px; height:8px; border-radius:50%; margin-top:3px; flex-shrink:0;}
  .pstatus-line .txt b{display:block; font-size:11px;}
  .pstatus-line .txt span{color:#666; font-size:10px;}
  .pmini{border:1px solid #e6e6e6; border-radius:6px; padding:8px 10px; font-size:11px; margin-bottom:6px;}
  .pmini .t{font-weight:700; color:#1F4E79;}
  .pconclusion{background:#FFF4D6; border-radius:6px; padding:12px 14px; font-size:12px; white-space:pre-wrap; line-height:1.5; border-left:4px solid #F2B705;}
  .pphoto-group{margin-bottom:10px; page-break-inside:avoid;}
  .pphoto-name{font-size:11px; font-weight:700; color:#1F4E79; margin-bottom:5px;}
  .pphoto-sub{font-size:10px; font-weight:600; color:#777; margin:5px 0 3px;}
  .pphoto-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:5px;}
  .pphoto-grid img{width:100%; height:70px; object-fit:cover; border-radius:5px; border:1px solid #ddd;}
  .psign-block{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:8px; page-break-inside:avoid;}
  .psign-item{font-size:11px;}
  .psign-line{border-bottom:1px solid #999; height:30px; margin-top:14px;}
  .psign-caption{display:flex; justify-content:space-between; font-size:9px; color:#888; margin-top:2px;}

  .print-fixed-footer{position:fixed; left:0; right:0; bottom:0; z-index:2;}
  .partner-band{background:#fff; padding:8px 26px; display:flex; align-items:center; justify-content:space-between; gap:14px; border-top:1px solid #eee; height:14mm; box-sizing:border-box;}
  .partner-band img{max-height:28px; max-width:18%; width:auto; height:auto; object-fit:contain;}

  .pfinal{position:relative; z-index:5; page-break-before:always; background:#fff; overflow:hidden; width:210mm; height:297mm;}
  .pfinal-static{display:block; width:210mm; height:297mm; object-fit:cover;}

  .pdoc-footer{position:relative; height:12mm; background:#0F2438;}
  /* последняя страница перекрывает фиксированный подвал (z-index выше) */
  .pdoc-footer::before{content:''; position:absolute; right:0; top:-16px; width:240px; height:28px; border-top:1px solid #6ab42b; border-left:1px solid #6ab42b; transform:skewX(-35deg);}
  .pdoc-footer::before{content:''; position:absolute; right:0; top:-16px; width:240px; height:28px; border-top:1px solid #6ab42b; border-left:1px solid #6ab42b; transform:skewX(-35deg);}
  .pfooter{background:#0F2438; color:#fff; padding:12px 26px; margin-top:8px; display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:center; font-size:10px;}
  .pfooter .fitem .ic{color:#3CB043;}

  @media print{
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    body *{visibility:hidden;}
    .print-only, .print-only *{visibility:visible;}
    .print-only{display:block !important; position:absolute; left:0; top:0; width:100%;}
    .punit, .pphoto-group, .psign-block{page-break-inside:avoid;}
  }
  .build-version{position:fixed; right:6px; bottom:4px; font-size:10px; color:#bbb; background:#fff; padding:1px 5px; border-radius:3px; z-index:9999; font-family:monospace;}
  @media print{ .build-version{display:none !important;} }

  /* ===== Вкладки ===== */
  .tabs{max-width:960px; margin:0 auto; padding:12px 18px 0; display:flex; gap:8px;}
  .tab{flex:1; padding:12px 8px; border:none; border-radius:10px 10px 0 0; background:#e6eaef; color:#556; font-weight:700; font-size:14px; cursor:pointer;}
  .tab.tab-active{background:#fff; color:var(--navy); box-shadow:0 -2px 6px rgba(0,0,0,.05);}
  @media print{ .tabs{display:none !important;} }

  /* ===== ТО: сводка/разделы (экран) ===== */
  .flag-pill{display:inline-block; padding:2px 8px; border-radius:20px; font-weight:600; margin-right:6px; font-size:12px;}
  .flag-ok{background:#e7f6ec; color:#2E9E4C;} .flag-yellow{background:#fdf3d7; color:#9a7400;}
  .flag-red{background:#fdecea; color:#D9362B;} .flag-batt{background:#eef2f7; color:var(--navy);}
  .sec-title{color:var(--navy); font-size:13px; font-weight:700; margin:16px 0 6px; padding-top:10px; border-top:1px dashed #e0e0e0; text-transform:uppercase; letter-spacing:.02em;}
  .mrow{display:flex; gap:10px; padding:6px 0; border-bottom:1px solid #f5f5f5; font-size:13px; align-items:baseline;}
  .mkey{color:#555; flex:1; font-weight:600;} .mval{color:#111; text-align:right; min-width:120px; font-variant-numeric:tabular-nums;}
  .mstatus{display:flex; gap:8px; align-items:baseline; padding:6px 0; border-bottom:1px solid #f5f5f5; font-size:13px; flex-wrap:wrap;}
  .mstatus .nm{font-weight:600; flex:1;} .mstatus .wd{min-width:110px; text-align:right;}
  .mstatus .cm{flex-basis:100%; color:#666; font-size:12px; padding-left:20px;}
  .mcheck{display:flex; gap:8px; align-items:baseline; padding:6px 0; border-bottom:1px solid #f5f5f5; font-size:13px;}
  .mcheck .mk{font-weight:700; width:18px; text-align:center;} .mcheck.on .mk{color:#2E9E4C;} .mcheck.off .mk{color:#bbb;}
  .phase-vals span{display:inline-block; margin-left:8px;} .phase-vals b{color:var(--navy);}
  .cells-table{width:100%; border-collapse:collapse; font-size:12px; margin:6px 0;}
  .cells-table th{background:#f4f6f9; color:#555; font-weight:700; padding:4px 6px; text-align:center; border:1px solid #e6e6e6;}
  .cells-table td{padding:4px 6px; text-align:center; border:1px solid #eee; font-variant-numeric:tabular-nums;}
  .cells-table tr.cell-weak td{background:#fdecea; color:#D9362B; font-weight:700;}
  .cells-stats{font-size:12px; color:#555; margin:4px 0 2px;} .cells-stats .weak{color:#D9362B; font-weight:700;}

  /* ===== ТО: печать (чистый A4) ===== */
  .to-print .p-head{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px solid; border-image:linear-gradient(90deg,#3CB043,#F2B705) 1; padding-bottom:8px; margin-bottom:12px;}
  .to-print .p-brand{font-size:18px; font-weight:900; color:var(--navy);} .to-print .p-brand .co{display:block; font-size:10px; font-weight:600; color:#666; letter-spacing:.04em;}
  .to-print .p-docno{text-align:right; font-size:12px;} .to-print .p-docno .num{font-weight:800; color:var(--navy); font-size:14px;}
  .to-print .p-title{font-size:15px; font-weight:800; color:var(--navy); text-transform:uppercase; margin:0 0 10px;}
  .to-print .p-info{display:grid; grid-template-columns:1fr 1fr; gap:2px 20px; font-size:11px; margin-bottom:12px;}
  .to-print .p-info .it{padding:3px 0; border-bottom:1px solid #f0f0f0;} .to-print .p-info .it .l{color:#888; font-size:9px; text-transform:uppercase;} .to-print .p-info .it .v{font-weight:600;}
  .to-print .p-unit{border:1px solid #e0e0e0; border-radius:6px; margin-bottom:10px; page-break-inside:avoid;}
  .to-print .p-unit-title{background:var(--navy); color:#fff; font-size:12px; font-weight:700; padding:5px 10px;}
  .to-print .p-unit-body{padding:8px 10px;}
  .to-print .p-conc{background:#FFF4D6; border-left:4px solid #F2B705; border-radius:6px; padding:10px 12px; font-size:11px; white-space:pre-wrap; line-height:1.45; margin-top:6px;}
  .to-print .p-sign{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:16px; page-break-inside:avoid;}
  .to-print .p-sign .ln{border-bottom:1px solid #999; height:26px; margin-top:12px;} .to-print .p-sign .cap{display:flex; justify-content:space-between; font-size:9px; color:#888; margin-top:2px;}
  .to-print .p-photos .grid{display:grid; grid-template-columns:repeat(5,1fr); gap:5px;} .to-print .p-photos img{width:100%; height:70px; object-fit:cover; border-radius:5px; border:1px solid #ddd;} .to-print .p-photos .name{font-size:11px; font-weight:700; color:var(--navy); margin:8px 0 4px;}
  @media print{ .to-print .sec-title{border-top:none; margin:8px 0 4px; font-size:11px;} .to-print .mrow,.to-print .mstatus,.to-print .mcheck{padding:2px 0; font-size:11px;} }
  @media print{
    #printTemplate .sec-title{font-size:10px; margin:6px 0 3px; padding-top:5px; border-top:1px dashed #ddd;}
    #printTemplate .mrow, #printTemplate .mstatus, #printTemplate .mcheck{font-size:10px; padding:2px 0;}
    #printTemplate .mstatus .cm{font-size:9px;}
    #printTemplate .cells-table{font-size:9px;}
    #printTemplate .punit{page-break-inside:avoid;}
  }

  /* ===== QR-наклейка ===== */
  .label-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; align-items:center; justify-content:center; padding:16px;}
  .label-overlay.show{display:flex;}
  .label-panel{background:#fff; border-radius:12px; padding:16px; max-width:360px; width:100%; text-align:center;}
  .label-panel h3{margin:0 0 10px; color:var(--navy); font-size:16px;}
  .label-card{border:2px solid var(--navy); border-radius:12px; padding:14px; margin:0 auto 14px; max-width:280px;}
  .label-card .lc-logo{height:34px; margin-bottom:8px;}
  .label-card .lc-model{font-weight:800; color:var(--navy); font-size:15px;}
  .label-card .lc-serial{font-family:monospace; font-weight:700; font-size:13px; background:var(--cream); display:inline-block; padding:3px 8px; border-radius:6px; margin:6px 0;}
  .label-card .lc-qr{margin:8px auto;}
  .label-card .lc-qr img{width:150px; height:150px; image-rendering:pixelated;}
  .label-card .lc-cap{font-size:11px; color:#555; margin-top:4px;}
  .label-panel .lp-actions{display:flex; gap:8px;}
  .label-panel .lp-actions button{flex:1; padding:11px; border-radius:8px; border:none; font-weight:700; font-size:14px; cursor:pointer;}
  .lp-print{background:var(--navy); color:#fff;} .lp-close{background:#eee; color:#333;}
  .lp-link{margin:10px 0; text-align:left;}
  .lp-link-row{display:flex; gap:6px; margin-top:4px;}
  .lp-link-row input{flex:1; padding:8px; border:1px solid #ccc; border-radius:7px; font-size:12px; font-family:monospace; background:#f7f9fb;}
  .lp-copy{padding:8px 12px; border:none; border-radius:7px; background:var(--amber); color:#1a1a1a; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap;}
  .print-label{text-align:center; padding:40px 20px;}
  .print-label .pl-card{border:3px solid var(--navy); border-radius:16px; padding:24px; display:inline-block; max-width:420px;}
  .print-label img.pl-logo{height:48px; margin-bottom:12px;}
  .print-label .pl-model{font-weight:800; color:var(--navy); font-size:22px;}
  .print-label .pl-serial{font-family:monospace; font-weight:700; font-size:18px; margin:10px 0;}
  .print-label img.pl-qr{width:230px; height:230px; image-rendering:pixelated; margin:8px 0;}
  .print-label .pl-cap{font-size:13px; color:#333; margin-top:8px; max-width:320px; margin-left:auto; margin-right:auto;}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="journalTitle">📋 Журнал актов</h1>
    <div class="sub">ERNES INDUSTRIAL POWER SYSTEMS · <span id="appVer"></span></div>
  </div>
</header>

<div class="tabs">
  <button class="tab tab-active" id="tabDiag" onclick="switchTab('diag')">⚡ Экспресс-диагностика</button>
  <button class="tab" id="tabTo" onclick="switchTab('to')">🔧 Техобслуживание</button>
</div>

<div class="wrap">

  <div id="listView">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Поиск по заказчику, модели, № акта...">
      <button onclick="reloadCurrent()">🔄 Обновить</button>
    </div>
    <div id="actsList"><div class="loading-msg">Загрузка...</div></div>
  </div>

  <div id="detailView">
    <button class="back-btn" onclick="showList()">← Назад к списку</button>
    <div id="detailContent"></div>
  </div>

</div>

<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightboxImg" src="">
</div>

<div class="label-overlay" id="labelOverlay">
  <div class="label-panel">
    <h3>QR-наклейка на ИБП</h3>
    <div id="labelPreview"></div>
    <div class="lp-link">
      <label style="font-size:12px;color:#666;">Ссылка (для отправки клиенту без QR):</label>
      <div class="lp-link-row">
        <input type="text" id="labelLink" readonly onclick="this.select()">
        <button type="button" class="lp-copy" onclick="copyLabelLink()">📋 Копировать</button>
      </div>
    </div>
    <div class="lp-actions">
      <button class="lp-print" onclick="printLabel()">🖨 Печать наклейки</button>
      <button class="lp-close" onclick="closeLabel()">Закрыть</button>
    </div>
  </div>
</div>

<div class="print-only" id="printTemplate"></div>

<div class="build-version">v10: редактирование ТО в журнале + 3 стадии (пост-ТО доработки)</div>


<script>
/* LOGO_B64 → logos.js */
/* UPS_MAIN_B64 → logos.js */
/* PARTNER_B64 → logos.js */

/* FINAL_PAGE_B64 → logos.js */

var APP_VERSION = 'v10 · 06.08.2026';
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx3XAT9CQAO2DJc0iBl1zWHuIAqnOCsT1qv2knZsaty4CHS_3AOejBd_G1jTH4WRiqDDQ/exec';
(function(){ var e=document.getElementById('appVer'); if(e) e.textContent = APP_VERSION; })();

var allActs = [];
var allActsTO = [];
var currentType = 'diag';   // 'diag' | 'to' — активная вкладка
var currentAct = null;
var editState = null;
var editPhotoGroups = [];
var viewPhotoGroups = [];

var STATUS_ITEMS = [
  {key:'statusBattery',   title:'АКБ'},
  {key:'statusDisplay',   title:'Индикация'},
  {key:'statusFans',      title:'Вентиляторы'},
  {key:'statusDust',      title:'Запылённость'}
];

function callGet(action, params){
  var url = APPS_SCRIPT_URL + '?action=' + action;
  Object.keys(params || {}).forEach(function(k){ url += '&' + k + '=' + encodeURIComponent(params[k]); });
  return fetchJson(url, { method: 'GET' }).then(unwrap);
}
function callPost(action, data){
  var body = Object.assign({ action: action }, data || {});
  return fetchJson(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  }).then(unwrap);
}
// Устойчивый JSON-запрос: если Apps Script вернул HTML (редирект/временная
// ошибка на «холодном» запросе) вместо JSON — тихо повторяем несколько раз.
// Так пропадает «Unexpected token '<'», которая раньше срывала загрузку.
function fetchJson(url, opts, attempt){
  attempt = attempt || 0;
  var MAX = 3;
  return fetch(url, opts).then(function(r){ return r.text(); }).then(function(text){
    var t = (text || '').trim();
    try {
      return JSON.parse(t);
    } catch(e){
      var looksHtml = t.charAt(0) === '<' || t.indexOf('<!DOCTYPE') !== -1 || t.indexOf('<html') !== -1;
      if(looksHtml && attempt < MAX){
        return new Promise(function(res){ setTimeout(res, 600 * (attempt + 1)); })
          .then(function(){ return fetchJson(url, opts, attempt + 1); });
      }
      throw new Error('сервер вернул не JSON (попробуйте обновить)');
    }
  });
}
function unwrap(res){
  if(!res.ok) throw new Error(res.error || 'Ошибка сервера');
  return res.data;
}

function esc(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
}
function safeParse(json, fallback){
  try { var v = JSON.parse(json || 'null'); return v || fallback; } catch(e){ return fallback; }
}
// Пропускает только https-ссылки на Google Drive/Docs — защита от подстановки
// javascript:/data: в href, если в поле когда-то попадёт мусор.
function safeDriveUrl(url){
  var s = String(url || '');
  return /^https:\/\/(drive|docs)\.google\.com\//.test(s) ? s : '#';
}

function statusClass(statusText){
  if(!statusText) return 'gray';
  if(statusText.indexOf('Норма') === 0) return 'green';
  if(statusText.indexOf('Замечание') === 0) return 'yellow';
  if(statusText.indexOf('Неисправность') === 0) return 'red';
  return 'gray';
}
function statusLabelWord(statusText){
  if(!statusText || statusText.indexOf('не отмечено') === 0) return '';
  return statusText.split(' — ')[0];
}
function statusComment(statusText){
  if(!statusText) return '';
  var parts = statusText.split(' — ');
  return parts.slice(1).join(' — ');
}
function statusDisplayText(statusText){
  var parsed = { label: statusLabelWord(statusText) || 'не отмечено', comment: statusComment(statusText) };
  return parsed.comment || parsed.label;
}
function worstStatusClass(units, key){
  var classes = units.map(function(u){ return statusClass(u.statuses ? u.statuses[key] : ''); });
  if(classes.indexOf('red') !== -1) return 'red';
  if(classes.indexOf('yellow') !== -1) return 'yellow';
  if(classes.indexOf('green') !== -1) return 'green';
  return 'gray';
}

// ===== Список =====
function loadActs(){
  document.getElementById('actsList').innerHTML = '<div class="loading-msg">Загрузка...</div>';
  callGet('listActs')
    .then(function(acts){ allActs = acts; renderList(acts); })
    .catch(function(err){
      document.getElementById('actsList').innerHTML = '<div class="empty-msg">Ошибка загрузки: ' + err.message + '</div>';
    });
}

function renderList(acts){
  var container = document.getElementById('actsList');
  if(!acts.length){ container.innerHTML = '<div class="empty-msg">Актов пока нет</div>'; return; }
  container.innerHTML = acts.map(function(act, idx){
    var units = safeParse(act.unitsJson, []);
    var dots = STATUS_ITEMS.map(function(item){ return '<div class="dot ' + worstStatusClass(units, item.key) + '"></div>'; }).join('');
    var modelsText = units.map(function(u){ return u.model; }).filter(Boolean).join(', ');
    return ''+
    '<div class="act-card" onclick="openDetail(' + idx + ')">'+
      '<div class="top-row">'+
        '<span class="act-num">' + esc(act.actNumber) + '</span>'+
        '<span class="date">' + esc(act.date) + '</span>'+
      '</div>'+
      '<div class="client">' + esc(act.client || '—') + '</div>'+
      '<div class="meta">' + esc(act.address || '') + (modelsText ? ' · ' + esc(modelsText) : '') + (units.length > 1 ? ' (' + units.length + ' ИБП)' : '') + '</div>'+
      '<div class="status-dots">' + dots + '</div>'+
    '</div>';
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', function(){
  var q = this.value.trim().toLowerCase();
  if(currentType === 'to'){
    if(!q){ renderListTO(allActsTO); return; }
    renderListTO(allActsTO.filter(function(act){ return actMatchesQuery(act, q); }));
    return;
  }
  if(!q){ renderList(allActs); return; }
  renderList(allActs.filter(function(act){ return actMatchesQuery(act, q); }));
});

function actMatchesQuery(act, q){
  var units = safeParse(act.unitsJson, []);
  var modelsText = units.map(function(u){ return (u.model||'') + ' ' + (u.serial||''); }).join(' ').toLowerCase();
  return (act.client||'').toLowerCase().indexOf(q) !== -1 ||
         modelsText.indexOf(q) !== -1 ||
         (act.actNumber||'').toLowerCase().indexOf(q) !== -1 ||
         (act.address||'').toLowerCase().indexOf(q) !== -1 ||
         (act.basis||'').toLowerCase().indexOf(q) !== -1;
}

function showList(){
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
}

function extractFolderId(url){
  if(!url) return null;
  var m = url.match(/folders\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

// ===== Детальный просмотр (read-only) =====
function openDetail(idx){
  currentAct = allActs[idx];
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';
  renderViewMode();
}

function toggleUnitBlock(elId){
  var body = document.getElementById(elId);
  var arrow = document.getElementById(elId + '_arrow');
  var collapsed = body.classList.toggle('collapsed');
  if(arrow) arrow.textContent = collapsed ? '▸' : '▾';
}

function renderViewMode(){
  var act = currentAct;
  var units = safeParse(act.unitsJson, []);
  var loads = safeParse(act.loadsJson, []);
  var genset = safeParse(act.gensetJson, []);

  var unitsHtml = units.length ? units.map(function(u, i){
    var badges = STATUS_ITEMS.map(function(item){ return '<div class="dot ' + statusClass(u.statuses ? u.statuses[item.key] : '') + '"></div>'; }).join('');
    var statusRows = STATUS_ITEMS.map(function(item){
      var raw = u.statuses ? u.statuses[item.key] : '';
      return '<div class="status-row"><div class="dot ' + statusClass(raw) + '"></div>'+
        '<div class="item-name">' + item.title + '</div>'+
        '<div class="item-comment">' + esc(statusDisplayText(raw)) + '</div></div>';
    }).join('');
    var bodyId = 'unitBody_' + i;
    return ''+
    '<div class="unit-block">'+
      '<div class="unit-block-header" onclick="toggleUnitBlock(\'' + bodyId + '\')">'+
        '<span class="arrow" id="' + bodyId + '_arrow">▸</span>'+
        '<span>ИБП #' + (i+1) + (u.model ? ' — ' + esc(u.model) : '') + (u.serial ? ' (' + esc(u.serial) + ')' : '') + '</span>'+
        '<span class="badges">' + badges + '</span>'+
      '</div>'+
      '<div class="unit-block-body collapsed" id="' + bodyId + '">'+
        '<table class="kv-table">'+
          row('Мощность', u.power ? u.power + ' ' + (u.powerUnit || 'кВА') : '') +
          row('Фазность', u.phases ? (String(u.phases)==='3'?'3-фазный':'1-фазный') : '') +
          row('Тип шкафа', u.cabinetType) + row('Кол-во шкафов', u.cabinetCount) +
          row('Кол-во АКБ', u.batteryCount) + row('Ёмкость АКБ', u.batteryCapacity ? u.batteryCapacity + ' Ач' : '') +
          row('Модель АКБ', u.batteryModel) + row('Год АКБ', u.batteryYear) +
          row('Температура', u.roomTemp ? u.roomTemp + ' °C' : '') +
        '</table>'+
        '<div class="section-title" style="margin-top:12px;">Состояние систем</div>'+
        statusRows+
        '<div class="section-title" style="margin-top:12px;">Фото по этому ИБП</div>'+
        '<div id="unitPhotos_' + i + '"><span class="no-photos">Загрузка фото...</span></div>'+
      '</div>'+
    '</div>';
  }).join('') : '<div class="no-photos">ИБП не указаны</div>';

  var loadsHtml = loads.length ? loads.map(function(l, i){
    return '<div class="sub-card"><div class="sub-title">Нагрузка #' + (i+1) + '</div>'+
      '<table class="kv-table">' + row('Название', l.name) + row('Мощность', l.power) + row('Комментарий', l.comment) + '</table></div>';
  }).join('') : '<div class="no-photos">Нагрузки не указаны</div>';

  var gensetHtml = genset.length ? genset.map(function(g, i){
    return '<div class="sub-card"><div class="sub-title"><span class="dot ' + statusClass(g.status==='green'?'Норма':g.status==='yellow'?'Замечание':g.status==='red'?'Неисправность':'') + '" style="display:inline-block;margin-right:6px;"></span>ДГУ #' + (i+1) + '</div>'+
      '<table class="kv-table">'+
      row('Модель', g.model) + row('Серийный №', g.serial) + row('Мощность', g.power ? g.power + ' кВА' : '') +
      row('Моточасы', g.motohours) + row('Комментарий', g.comment) +
      '</table></div>';
  }).join('') : '<div class="no-photos">ДГУ не установлен</div>';

  document.getElementById('detailContent').innerHTML = ''+
    '<div class="detail-card">'+
      '<div class="detail-header-row">'+
        '<h2>' + esc(act.actNumber) + '</h2>'+
        '<div>'+
          '<label style="font-size:13px;margin-right:10px;user-select:none;cursor:pointer;">'+
            '<input type="checkbox" id="printPhotos" checked style="vertical-align:middle;margin-right:4px;"> Фото в акте'+
          '</label>'+
          '<button class="edit-btn" onclick="printAct()">🖨 Печать / PDF</button>'+
          '<button class="edit-btn" style="margin-left:8px;" onclick="enterEditMode()">✏️ Редактировать</button>'+
        '</div>'+
      '</div>'+
      '<div class="detail-sub">' + esc(act.date) + ' · инженер ' + esc(act.engineer || '—') + '</div>'+
      '<table class="kv-table">'+
        row('Заказчик', act.client) + row('Контактное лицо', act.contact) +
        row('Адрес объекта', act.address) + row('Основание', act.basis) +
      '</table>'+
      '<div class="section-title">ИБП</div>' + unitsHtml +
      '<div class="section-title">Нагрузки</div>' + loadsHtml +
      '<div class="section-title">ДГУ</div>' + gensetHtml +
      '<div class="section-title">Заключение и рекомендации</div>'+
      '<div class="conclusion-box">' + esc(act.conclusion || 'не заполнено') + '</div>'+
      '<div class="section-title">Прочие фото (помещение, нагрузки, ДГУ)</div>'+
      '<div id="photoGroups"><span class="no-photos">Загрузка фото...</span></div>'+
      (act.folderUrl ? '<a class="drive-link" href="' + safeDriveUrl(act.folderUrl) + '" target="_blank">📁 Открыть папку в Drive</a>' : '') +
    '</div>';

  loadPhotos(act.folderUrl);
}

function row(label, value){
  return '<tr><td class="k">' + label + '</td><td>' + esc(value || '—') + '</td></tr>';
}

function renderPhotoGroupsHtml(groups, prefix){
  prefix = prefix || 'g';
  if(!groups.length) return '<span class="no-photos">Фото не прикреплены</span>';
  return groups.map(function(g, gi){
    var directImgs = g.photos.map(function(p){
      return '<img src="' + thumbUrl(p, 220) + '" onclick="openLightbox(\'' + p.url + '\')" loading="lazy">';
    }).join('');
    var subHtml = '';
    if(g.subgroups && g.subgroups.length){
      subHtml = g.subgroups.map(function(sg){
        var imgs = sg.photos.map(function(p){
          return '<img src="' + thumbUrl(p, 220) + '" onclick="openLightbox(\'' + p.url + '\')" loading="lazy">';
        }).join('');
        return '<div class="photo-subgroup-title">' + esc(sg.group) + ' (' + sg.photos.length + ')</div><div class="photo-grid">' + imgs + '</div>';
      }).join('');
    }
    var bodyId = 'photoGroupBody_' + prefix + '_' + gi;
    return ''+
      '<div class="unit-block">'+
        '<div class="unit-block-header" onclick="toggleUnitBlock(\'' + bodyId + '\')">'+
          '<span class="arrow" id="' + bodyId + '_arrow">▸</span>'+
          '<span>' + esc(g.group) + '</span>'+
        '</div>'+
        '<div class="unit-block-body collapsed" id="' + bodyId + '">'+
          (directImgs ? '<div class="photo-grid">' + directImgs + '</div>' : '') +
          subHtml +
        '</div>'+
      '</div>';
  }).join('');
}

function loadPhotos(folderUrl){
  var folderId = extractFolderId(folderUrl);
  var container = document.getElementById('photoGroups');
  if(!container) return;
  if(!folderId){
    container.innerHTML = '<span class="no-photos">Папка с фото не найдена</span>';
    fillUnitPhotos([]);
    return;
  }
  callGet('getPhotos', { folderId: folderId })
    .then(function(groups){
      viewPhotoGroups = groups;
      var rest = distributePhotosToUnits(groups);
      container.innerHTML = rest.length ? renderPhotoGroupsHtml(rest, 'other') : '<span class="no-photos">Прочих фото нет</span>';
    })
    .catch(function(err){
      container.innerHTML = '<span class="no-photos">Не удалось загрузить фото: ' + err.message + '</span>';
      fillUnitPhotos([]);
    });
}

// Возвращает номер ИБП (1-based) из имени группы вида "ИБП #2/АКБ", иначе null
function unitIndexFromGroup(name){
  var m = /^\s*ИБП\s*#\s*(\d+)/i.exec(name || '');
  return m ? parseInt(m[1], 10) : null;
}

function fillUnitPhotos(groupsForUnits){
  var units = safeParse(currentAct.unitsJson, []);
  units.forEach(function(u, i){
    var el = document.getElementById('unitPhotos_' + i);
    if(!el) return;
    var mine = (groupsForUnits || []).filter(function(g){ return unitIndexFromGroup(g.group) === (i+1); });
    el.innerHTML = mine.length ? renderPhotoGroupsHtml(mine, 'u' + i) : '<span class="no-photos">Фото по этому ИБП нет</span>';
  });
}

    .then(function(){
      var g = editPhotoGroups.find(function(x){ return x.group === group; });
      if(g){
        if(subgroup){
          var sg = (g.subgroups || []).find(function(x){ return x.group === subgroup; });
          if(sg) sg.photos = sg.photos.filter(function(p){ return p.id !== fileId; });
          g.subgroups = (g.subgroups || []).filter(function(x){ return x.photos.length; });
        } else {

        }

var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
var activeRecognition = null;
function toggleMic(btnEl, textareaId){
  if(!Recognition){ alert('Голосовой ввод не поддерживается в этом браузере.'); return; }
  if(activeRecognition){ activeRecognition.stop(); return; }
  var textarea = document.getElementById(textareaId);
  var rec = new Recognition();
  rec.lang = 'ru-RU'; rec.continuous = true; rec.interimResults = false;
  rec.onresult = function(e){
    var chunk = '';
    for(var i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) chunk += e.results[i][0].transcript + ' ';
    }
    if(chunk){
      textarea.value = (textarea.value ? textarea.value.trim() + ' ' : '') + chunk.trim();
      textarea.dispatchEvent(new Event('input'));
    }
  };
  rec.onend = function(){ btnEl.classList.remove('rec'); activeRecognition = null; };
  rec.onerror = function(e){ btnEl.classList.remove('rec'); activeRecognition = null; if(e.error !== 'no-speech') alert('Ошибка распознавания: ' + e.error); };
  activeRecognition = rec;
  btnEl.classList.add('rec');
  rec.start();
}

// Миниатюра Google Drive вместо полного файла (в разы меньше и быстрее)
function thumbUrl(p, w){
  if(p && p.id) return 'https://drive.google.com/thumbnail?id=' + p.id + '&sz=w' + (w || 400);
  return p ? p.url : '';
}

// Ждём реальной загрузки картинок (с ограничением по времени), затем печатаем
function waitImagesThenPrint(container, maxMs){
  var imgs = Array.prototype.slice.call(container.querySelectorAll('img'));
  var pending = imgs.filter(function(im){ return !im.complete; });
  if(!pending.length){ window.print(); return; }
  var done = 0, finished = false;
  function finish(){
    if(finished) return;
    finished = true;
    window.print();
  }
  pending.forEach(function(im){
    function tick(){ done++; if(done >= pending.length) finish(); }
    im.addEventListener('load', tick, { once:true });
    im.addEventListener('error', tick, { once:true });
  });
  setTimeout(finish, maxMs || 8000);
}

// Ленивая загрузка логотипов (logos.js ~2.9 МБ) — только когда реально нужны
// (печать/наклейка), чтобы журнал открывался быстро.
var _logosPromise = null;
function ensureLogos(){
  if(typeof LOGO_B64 !== 'undefined') return Promise.resolve();
  if(_logosPromise) return _logosPromise;
  _logosPromise = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = 'logos.js';
    s.onload = function(){ resolve(); };
    s.onerror = function(){ _logosPromise = null; reject(new Error('Не удалось загрузить логотипы')); };
    document.head.appendChild(s);
  });
  return _logosPromise;
}

/* ===================== Общая сводка (титульный лист печати) ===================== */
function worseOf(a, b){
  var rank = { '':0, gray:0, green:1, yellow:2, red:3 };
  return (rank[b] > rank[a]) ? b : a;
}
function scoreOf(cls){ return cls==='green'?1:cls==='yellow'?0.5:cls==='red'?0:null; }

// Диагностика: направления = 6 систем; + замечания, статистика, выводы.
function overviewDiag(units){
  var total=0, sum=0, dirs=[], findings=[], g=0,y=0,r=0;
  STATUS_ITEMS.forEach(function(item){
    var worst='';
    units.forEach(function(u, i){
      var raw = u.statuses ? u.statuses[item.key] : '';
      var c = statusClass(raw);
      var sc = scoreOf(c);
      if(sc !== null){
        total++; sum += sc; worst = worseOf(worst, c);
        if(c==='green') g++; else if(c==='yellow') y++; else if(c==='red') r++;
        if(c==='yellow' || c==='red'){
          var cmt = statusComment(raw) || statusLabelWord(raw);
          findings.push({ level:c, text:'ИБП #'+(i+1)+' — '+item.title+(cmt?': '+cmt:'') });
        }
      }
    });
    dirs.push({ name:item.title, cls:worst||'gray' });
  });
  var pct = total ? Math.round(sum/total*100) : null;
  return { pct:pct, dirs:dirs, findings:findings,
    stats:{ units:units.length, green:g, yellow:y, red:r, checks:total },
    conclusions: keyConclusions(pct, r, y, 'diag') };
}

// ТО: направления = разделы; + замечания (статусы/дефект/слабые АКБ), статистика, выводы.
function overviewTO(units){
  var totalA=0, sumA=0, totalB=0, sumB=0, dirs=[], findings=[], g=0,y=0,r=0;
  TO_SECTIONS.forEach(function(sec){
    var worst='', chkTotal=0, chkDone=0;
    sec.items.forEach(function(it){
      if(it.t==='status'){
        units.forEach(function(u, i){
          var s = statusSlot(u, it.key);
          var scB = scoreOf(s.before), scA = scoreOf(s.after);
          if(scB !== null){ totalB++; sumB += scB; }
          if(scA !== null){
            totalA++; sumA += scA; worst = worseOf(worst, s.after);
            if(s.after==='green') g++; else if(s.after==='yellow') y++; else if(s.after==='red') r++;
          }
          // замечание = было не норма; показываем устранение
          if(s.before==='yellow' || s.before==='red'){
            var txt = 'ИБП #'+(i+1)+' — '+it.label+': было '+shortWord(s.before)+
                      (s.work ? ', ' + s.work : '') + (s.after ? ' → стало '+shortWord(s.after) : '');
            findings.push({ level:(s.after==='green'?'fixed':s.before), text:txt });
          }
        });
      } else if(it.t==='check'){
        units.forEach(function(u){ chkTotal++; if(getTo(u)[it.key]) chkDone++; });
      }
    });
    var cls = worst;
    if(!cls){ cls = chkTotal ? (chkDone===chkTotal?'green':chkDone>0?'yellow':'gray') : 'gray'; }
    dirs.push({ name: sec.n + '. ' + sec.title, cls: cls });
  });
  units.forEach(function(u, i){
    var d = statusSlot(u,'defect');
    var scB=scoreOf(d.before), scA=scoreOf(d.after);
    if(scB!==null){ totalB++; sumB+=scB; }
    if(scA!==null){ totalA++; sumA+=scA; if(d.after==='green')g++; else if(d.after==='yellow')y++; else if(d.after==='red')r++; }
    if(d.before==='yellow'||d.before==='red'){
      findings.push({ level:(d.after==='green'?'fixed':d.before), text:'ИБП #'+(i+1)+' — требуется замена/ремонт: было '+shortWord(d.before)+(d.work?', '+d.work:'')+(d.after?' → стало '+shortWord(d.after):'') });
    }
    var weak = weakCellNumbers(getTo(u).s10_cells||[]);
    if(weak.length) findings.push({ level:'yellow', text:'ИБП #'+(i+1)+' — слабые элементы АКБ: №'+weak.join(', №') });
  });
  var pctA = totalA ? Math.round(sumA/totalA*100) : null;
  var pctB = totalB ? Math.round(sumB/totalB*100) : null;
  return { pct:pctA, pctBefore:pctB, dirs:dirs, findings:findings,
    stats:{ units:units.length, green:g, yellow:y, red:r, checks:totalA },
    conclusions: keyConclusions(pctA, r, y, 'to') };
}
function shortWord(v){ return v==='green'?'норма':v==='yellow'?'замечание':v==='red'?'неисправность':'—'; }
// Процент состояния по стадии для набора ИБП (журнал).
function toPctUnitsJ(units, stage){
  var total=0, sum=0;
  (units||[]).forEach(function(u){
    toForEachItem(function(it){ if(it.t==='status'){ var sc=scoreOf(statusSlot(u,it.key)[stage]); if(sc!==null){ total++; sum+=sc; } } });
    var d=scoreOf(statusSlot(u,'defect')[stage]); if(d!==null){ total++; sum+=d; }
  });
  return total ? Math.round(sum/total*100) : null;
}

// Ключевые выводы — генерируются из общей оценки и наличия замечаний.
function keyConclusions(pct, reds, yellows, mode){
  var kc = [];
  if(pct != null){
    if(pct>=90) kc.push('Оборудование функционирует в штатном режиме');
    else if(pct>=70) kc.push('Оборудование работоспособно, выявлены отдельные замечания');
    else if(pct>=50) kc.push('Оборудование требует внимания и устранения замечаний');
    else kc.push('Оборудование в критическом состоянии — требуется вмешательство');
  }
  if(reds) kc.push('Обнаружены неисправности, требующие устранения ('+reds+')');
  else if(yellows) kc.push('Выявлены замечания, не требующие срочного вмешательства');
  else kc.push('Критических замечаний не выявлено');
  kc.push(mode==='to' ? 'Техническое обслуживание выполнено согласно регламенту' : 'Рекомендуется плановое техническое обслуживание');
  return kc;
}

function countPhotos(groups){
  var n = 0;
  (groups||[]).forEach(function(g){
    n += (g.photos ? g.photos.length : 0);
    (g.subgroups||[]).forEach(function(sg){ n += (sg.photos ? sg.photos.length : 0); });
  });
  return n;
}

function donutHtml(pct){
  var r=48, C=2*Math.PI*r;
  var p = (pct==null) ? 0 : pct;
  var off = C*(1 - p/100);
  var color = p>=90?'#2E9E4C':p>=70?'#8FBF3F':p>=50?'#E0A800':'#D9362B';
  var label = (pct==null)?'нет данных':p>=90?'Отличное состояние':p>=70?'Хорошее состояние':p>=50?'Требует внимания':'Критическое состояние';
  var center = (pct==null)?'—':(pct+'%');
  return '<div class="pov-donut">'+
    '<svg width="118" height="118" viewBox="0 0 118 118">'+
      '<circle cx="59" cy="59" r="'+r+'" fill="none" stroke="#eee" stroke-width="12"></circle>'+
      '<circle cx="59" cy="59" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" '+
        'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 59 59)"></circle>'+
      '<text x="59" y="59" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="800" fill="#1F4E79">'+center+'</text>'+
    '</svg>'+
    '<div class="pov-label" style="color:'+color+'">'+label+'</div>'+
  '</div>';
}

function overviewSectionHtml(ov, photoCount){
  var dirs = ov.dirs.map(function(d){
    var col = d.cls==='green'?'#2E9E4C':d.cls==='yellow'?'#E0A800':d.cls==='red'?'#D9362B':'#ccc';
    return '<div class="pov-dir"><span class="pov-dir-name">'+esc(d.name)+'</span><span class="pov-dot" style="background:'+col+'"></span></div>';
  }).join('');

  var conclHtml = ov.conclusions.map(function(t){
    return '<div class="pov-li ok"><span class="ic">✓</span><span>'+esc(t)+'</span></div>';
  }).join('');

  var findings = ov.findings.slice().sort(function(a,b){
    var rank = function(l){ return l==='red'?3:l==='yellow'?2:l==='fixed'?1:0; };
    return rank(b.level)-rank(a.level);
  });
  var shown = findings.slice(0, 10);
  var findHtml = shown.length ? shown.map(function(f){
    if(f.level==='fixed') return '<div class="pov-li ok"><span class="ic">✓</span><span>'+esc(f.text)+'</span></div>';
    var cls = f.level==='red' ? 'bad' : 'warn';
    return '<div class="pov-li '+cls+'"><span class="ic">⚠</span><span>'+esc(f.text)+'</span></div>';
  }).join('') + (findings.length>10 ? '<div class="pov-more">…и ещё '+(findings.length-10)+'</div>' : '')
    : '<div class="pov-li ok"><span class="ic">✓</span><span>Замечаний не выявлено</span></div>';

  var s = ov.stats;
  var statCells = [
    ['ИБП', s.units],
    ['Проверок', s.checks],
    ['🟢 Норма', s.green],
    ['🟡 Замечания', s.yellow],
    ['🔴 Неисправно', s.red]
  ];
  if(typeof photoCount === 'number') statCells.push(['Фото', photoCount]);
  var statsHtml = statCells.map(function(c){
    return '<div class="pov-stat"><div class="v">'+c[1]+'</div><div class="l">'+c[0]+'</div></div>';
  }).join('');

  // «Было → стало» (для ТО, где есть pctBefore)
  var improve = '';
  if(typeof ov.pctBefore === 'number' && ov.pctBefore !== null){
    var up = (ov.pct||0) - ov.pctBefore;
    improve = '<div class="pov-improve">Состояние объекта: <b>было '+ov.pctBefore+'%</b> → <b style="color:#2E9E4C">стало '+(ov.pct!==null?ov.pct:ov.pctBefore)+'%</b>'+
      (up>0?' <span class="pov-up">▲ +'+up+'%</span>':'')+'</div>';
  }
  var findHead = (typeof ov.pctBefore === 'number') ? 'Замечания и что сделано' : 'Основные замечания';

  return '<div class="psection">'+
    '<div class="psection-head">Общая оценка объекта</div>'+
    improve+
    '<div class="poverview">'+
      donutHtml(ov.pct)+
      '<div class="pov-dirs">'+dirs+'</div>'+
    '</div>'+
    '<div class="pov-cols">'+
      '<div class="pov-block"><div class="pov-block-head">Ключевые выводы</div>'+conclHtml+'</div>'+
      '<div class="pov-block"><div class="pov-block-head">'+findHead+'</div>'+findHtml+'</div>'+
    '</div>'+
    '<div class="pov-stats">'+statsHtml+'</div>'+
  '</div>';
}

function toForEachItem(cb){ TO_SECTIONS.forEach(function(sec){ sec.items.forEach(function(it){ cb(it, sec); }); }); }
function dotClass(v){ return (v === 'green' || v === 'yellow' || v === 'red') ? v : 'gray'; }
function statusWord(v){ return v==='green'?'Норма':v==='yellow'?'Замечание':v==='red'?'Неисправность':'не отмечено'; }
function getTo(u){ return (u && u.to) || {}; }
function statusSlot(u, key){
  var s = getTo(u)[key];
  if(!s || typeof s !== 'object') return { before:'', work:'', after:'', afterService:'' };
  if('before' in s || 'after' in s) return { before:s.before||'', work:s.work||'', after:s.after||'', afterService:(s.afterService!==undefined&&s.afterService!==null?s.afterService:'') };
  return { before:s.value||'', work:s.comment||'', after:s.value||'', afterService:s.value||'' }; // старый формат
}
// Строка статуса ТО с логикой ДО → работа → ПОСЛЕ.
function statusRowHtml(label, s){
  if(!s.before && !s.after){
    return '<div class="mstatus"><span class="dot gray"></span><span class="nm">'+esc(label)+'</span><span class="wd">не отмечено</span></div>';
  }
  if(s.before === 'green'){
    return '<div class="mstatus"><span class="dot green"></span><span class="nm">'+esc(label)+'</span><span class="wd">Норма</span></div>';
  }
  var html = '<div class="mstatus"><span class="dot '+dotClass(s.before)+'"></span><span class="nm">'+esc(label)+'</span>'+
    '<span class="wd">было: '+statusWord(s.before)+'</span>';
  if(s.work) html += '<span class="cm">🔧 выполнено: '+esc(s.work)+'</span>';
  if(s.after) html += '<span class="cm" style="color:'+(s.after==='green'?'#2E9E4C':'#9a7400')+'">→ стало: '+statusWord(s.after)+'</span>';
  html += '</div>';
  return html;
}

function weakCellFlags(arr){
  arr = arr || [];
  var us = [], rs = [];
  arr.forEach(function(c){ var u=parseFloat(c.u); if(!isNaN(u)) us.push(u); var r=parseFloat(c.r); if(!isNaN(r)) rs.push(r); });
  var meanU = us.length ? us.reduce(function(a,b){return a+b;},0)/us.length : null;
  var meanR = rs.length ? rs.reduce(function(a,b){return a+b;},0)/rs.length : null;
  var flags = arr.map(function(c){
    var u=parseFloat(c.u), r=parseFloat(c.r), weak=false;
    if(meanU!==null && us.length>=3 && !isNaN(u) && u < meanU*0.97) weak=true;
    if(meanR!==null && rs.length>=3 && !isNaN(r) && meanR>0 && r > meanR*1.30) weak=true;
    return weak;
  });
  return { flags: flags, meanU: meanU, meanR: meanR };
}
function weakCellNumbers(arr){ var res=weakCellFlags(arr), out=[]; res.flags.forEach(function(w,i){ if(w) out.push(i+1); }); return out; }

function unitFlagCounts(u){
  var reds=0, yellows=0;
  toForEachItem(function(it){ if(it.t==='status'){ var v=statusSlot(u,it.key).before; if(v==='red')reds++; else if(v==='yellow')yellows++; } });
  var d=statusSlot(u,'defect').before; if(d==='red')reds++; else if(d==='yellow')yellows++;
  return { reds:reds, yellows:yellows, weak: weakCellNumbers(getTo(u).s10_cells||[]).length };
}
function actFlagCounts(units){ var t={reds:0,yellows:0,weak:0}; (units||[]).forEach(function(u){ var c=unitFlagCounts(u); t.reds+=c.reds; t.yellows+=c.yellows; t.weak+=c.weak; }); return t; }
function flagsPillsHtml(c){
  var out='';
  if(c.reds) out+='<span class="flag-pill flag-red">🔴 '+c.reds+'</span>';
  if(c.yellows) out+='<span class="flag-pill flag-yellow">🟡 '+c.yellows+'</span>';
  if(!c.reds && !c.yellows) out+='<span class="flag-pill flag-ok">🟢 без замечаний</span>';
  if(c.weak) out+='<span class="flag-pill flag-batt">АКБ: слабых '+c.weak+'</span>';
  return out;
}

function unitIdTableHtml(u){

    row('Модель АКБ', u.batteryModel) + row('Год АКБ', u.batteryYear) +

}
function toItemHtml(u, item){
  var to = getTo(u);
  if(item.t==='status'){
    return statusRowHtml(item.label, statusSlot(u, item.key));
  }
  if(item.t==='num'){ var v=to[item.key]; var shown=(v===''||v===undefined||v===null)?'—':esc(v)+(item.unit?' '+item.unit:''); return '<div class="mrow"><span class="mkey">'+esc(item.label)+'</span><span class="mval">'+shown+'</span></div>'; }
  if(item.t==='text'){ var tv=to[item.key]; return '<div class="mrow"><span class="mkey">'+esc(item.label)+'</span><span class="mval">'+(tv?esc(tv):'—')+'</span></div>'; }
  if(item.t==='check'){ var on=!!to[item.key]; return '<div class="mcheck '+(on?'on':'off')+'"><span class="mk">'+(on?'✓':'—')+'</span><span>'+esc(item.label)+'</span></div>'; }
  if(item.t==='phase'){
    var arr=to[item.key]||['','',''];
    var any=arr.some(function(x){return x!==''&&x!==undefined&&x!==null;});
    var vals=any?('<span class="phase-vals">'+['L1','L2','L3'].map(function(ph,i){return '<span>'+ph+' <b>'+esc(arr[i]||'—')+'</b></span>';}).join('')+(item.unit?' '+item.unit:'')+'</span>'):'—';
    return '<div class="mrow"><span class="mkey">'+esc(item.label)+'</span><span class="mval">'+vals+'</span></div>';
  }
  if(item.t==='cells'){ return toCellsHtml(to[item.key]||[]); }
  return '';
}
function toCellsHtml(arr){
  if(!arr.length) return '<div class="mrow"><span class="mkey">Элементы АКБ</span><span class="mval">не заполнено</span></div>';
  var res=weakCellFlags(arr);
  var rows=arr.map(function(c,i){ var cls=res.flags[i]?' class="cell-weak"':''; return '<tr'+cls+'><td>'+(i+1)+'</td><td>'+esc(c.u||'—')+'</td><td>'+esc(c.r||'—')+'</td></tr>'; }).join('');
  var weak=[]; res.flags.forEach(function(w,i){ if(w) weak.push(i+1); });
  var stats='<div class="cells-stats">Элементов: '+arr.length+(res.meanU!==null?' · средн. U '+res.meanU.toFixed(2)+' В':'')+(res.meanR!==null?' · средн. R '+res.meanR.toFixed(1)+' мОм':'')+(weak.length?' · <span class="weak">слабые: №'+weak.join(', №')+'</span>':' · <span style="color:#2E9E4C">слабых нет</span>')+'</div>';
  return '<div style="margin:6px 0;"><div class="mkey" style="margin-bottom:4px;">Элементы АКБ (U / внутр. сопротивление)</div>'+
    '<table class="cells-table"><thead><tr><th>№</th><th>U, В</th><th>R, мОм</th></tr></thead><tbody>'+rows+'</tbody></table>'+stats+'</div>';
}
function toUnitSectionsHtml(u){
  var sections=TO_SECTIONS.map(function(sec){ var items=sec.items.map(function(it){ return toItemHtml(u,it); }).join(''); return '<div class="sec-title">'+sec.n+'. '+esc(sec.title)+'</div>'+items; }).join('');
  var defect='<div class="sec-title">Выявленные неисправности</div>'+statusRowHtml('Требуется замена / ремонт узлов', statusSlot(u,'defect'));
  return sections+defect;
}

  document.getElementById('detailContent').innerHTML =

        '<button class="edit-btn" onclick="printActTO()">🖨 Печать / PDF</button></div></div>'+

      (function(){
        var pb=toPctUnitsJ(units,'before'), ps=toPctUnitsJ(units,'afterService'), pa=toPctUnitsJ(units,'after');
        if(pb===null) return '';

      })()+

      (act.folderUrl?'<a class="drive-link" href="'+safeDriveUrl(act.folderUrl)+'" target="_blank">📁 Открыть папку в Drive</a>':'')+
    '</div>';

  loadPhotos(act.folderUrl); // общая функция диаг-журнала

  var act = currentAct;

  editStateTO = {
    client: act.client||'', contact: act.contact||'', address: act.address||'',
    basis: act.basis||'', engineer: act.engineer||'', conclusion: act.conclusion||'',
    units: units.map(function(u){ return JSON.parse(JSON.stringify(u)); }) // глубокая копия (сохраняет to + afterService)
  };
  renderEditModeTO();
}

function etoField(label, prop, val){
  return '<div class="edit-field"><label>'+label+'</label><input type="text" value="'+esc(val)+'" oninput="editStateTO.'+prop+'=this.value"></div>';
}
function etoStatusSelect(idx, key, stage, cur){
  var opts = [['','—'],['green','🟢 Норма'],['yellow','🟡 Замечание'],['red','🔴 Неисправность']];
  return '<select onchange="editStateTO.units['+idx+'].to[\''+key+'\'].'+stage+'=this.value">'+
    opts.map(function(o){ return '<option value="'+o[0]+'"'+(cur===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select>';

function etoSlotHtml(idx, key, label){
  var s = editStateTO.units[idx].to[key];

  var svc = (s.afterService!==undefined && s.afterService!=='' && s.afterService!==null)
    ? '<div class="eto-svc">снимок «после ТО»: '+shortWord(s.afterService)+' (не меняется)</div>' : '';
  return '<div class="eto-item"><div class="eto-lbl">'+esc(label)+'</div>'+

    '<div class="eto-row"><span>ПОСЛЕ:</span>'+etoStatusSelect(idx,key,'after',s.after||'')+'</div>'+svc+'</div>';

function etoItemHtml(idx, item){

  if(item.t==='text') return '<div class="eto-item"><div class="eto-row"><span>'+esc(item.label)+'</span><input type="text" value="'+esc(to[key]||'')+'" oninput="editStateTO.units['+idx+'].to[\''+key+'\']=this.value"></div></div>';
  if(item.t==='check') return '<div class="eto-item"><label class="eto-check"><input type="checkbox"'+(to[key]?' checked':'')+' onchange="editStateTO.units['+idx+'].to[\''+key+'\']=this.checked"> '+esc(item.label)+'</label></div>';

function saveEditTO(){
  var payload = {
    client: editStateTO.client, contact: editStateTO.contact, address: editStateTO.address,
    basis: editStateTO.basis, engineer: editStateTO.engineer, conclusion: editStateTO.conclusion,
    units: editStateTO.units
  };
  callPost('updateMaintenance', { actNumber: currentAct.actNumber, payload: payload })
    .then(function(){
      Object.assign(currentAct, {
        client: payload.client, contact: payload.contact, address: payload.address,
        basis: payload.basis, engineer: payload.engineer, conclusion: payload.conclusion,
        unitsJson: JSON.stringify(payload.units)
      });
      renderViewModeTO();
    })
    .catch(function(err){ alert('Не удалось сохранить: ' + err.message); });

function printActTOInner(){
  var act=currentAct;

  var folderId=extractFolderId(act.folderUrl);
  var tpl=document.getElementById('printTemplate');
  function go(groups,flag){ renderPrintTemplateTO(act,groups,flag); if(flag) waitImagesThenPrint(tpl,8000); else setTimeout(function(){ window.print(); },100); }

/* ===================== QR-наклейка на ИБП ===================== */
function normSerial(s){ return String(s||'').trim().toUpperCase().replace(/\s+/g,''); }

function cardUrlFor(serial){
  // ссылка на публичную карточку card.html рядом с этим журналом
  var base = new URL('card.html', location.href).href;
  return base + '?sn=' + encodeURIComponent(normSerial(serial));
}

function qrDataUrl(text, cell){
  if(typeof qrcode === 'undefined') return null;
  var qr = qrcode(0, 'M');      // авто-версия, коррекция M
  qr.addData(text);
  qr.make();
  return qr.createDataURL(cell || 6, 8);
}

var _labelCtx = null; // {serial, model, url, img}

function makeLabel(unitIdx){
  ensureLogos().then(function(){ makeLabelInner(unitIdx); }).catch(function(){ makeLabelInner(unitIdx); });
}
function makeLabelInner(unitIdx){
  var units = safeParse(currentAct.unitsJson, []);
  var u = units[unitIdx];
  if(!u || !u.serial){ alert('У этого ИБП не указан серийный № — QR-наклейку не создать.'); return; }
  var serial = normSerial(u.serial);
  var url = cardUrlFor(serial);
  var img = qrDataUrl(url, 6);
  if(!img){ alert('QR-модуль не загрузился (нет интернета?). Откройте журнал онлайн и повторите.'); return; }
  _labelCtx = { serial: serial, model: u.model || 'ИБП', url: url, img: img };

  var logo = (typeof LOGO_B64 !== 'undefined') ? '<img class="lc-logo" src="data:image/png;base64,'+LOGO_B64+'">' : '';
  document.getElementById('labelPreview').innerHTML =
    '<div class="label-card">'+logo+
      '<div class="lc-model">'+esc(_labelCtx.model)+'</div>'+
      '<div class="lc-serial">S/N '+esc(serial)+'</div>'+
      '<div class="lc-qr"><img src="'+img+'"></div>'+
      '<div class="lc-cap">Сканируйте — история обслуживания ИБП</div>'+
    '</div>';
  document.getElementById('labelLink').value = _labelCtx.url;
  document.getElementById('labelOverlay').classList.add('show');
}

function copyLabelLink(){
  var inp = document.getElementById('labelLink');
  inp.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  if(navigator.clipboard && _labelCtx){ navigator.clipboard.writeText(_labelCtx.url).then(function(){}, function(){}); ok = true; }
  var btn = document.querySelector('.lp-copy');
  if(btn){ var t = btn.textContent; btn.textContent = ok ? '✓ Скопировано' : 'Выделено — Ctrl+C'; setTimeout(function(){ btn.textContent = t; }, 1500); }
}

function closeLabel(){ document.getElementById('labelOverlay').classList.remove('show'); }

function printLabel(){
  if(!_labelCtx) return;
  var logo = (typeof LOGO_B64 !== 'undefined') ? '<img class="pl-logo" src="data:image/png;base64,'+LOGO_B64+'">' : '';
  document.getElementById('printTemplate').innerHTML =
    '<div class="print-label"><div class="pl-card">'+logo+
      '<div class="pl-model">'+esc(_labelCtx.model)+'</div>'+
      '<div class="pl-serial">S/N '+esc(_labelCtx.serial)+'</div>'+
      '<img class="pl-qr" src="'+_labelCtx.img+'">'+
      '<div class="pl-cap">Отсканируйте QR-код камерой телефона, чтобы увидеть полную историю технического обслуживания этого ИБП.<br>ТОО «ERNES INDUSTRIAL POWER SYSTEMS» · ernes.kz</div>'+
    '</div></div>';
  setTimeout(function(){ window.print(); }, 100);
}
